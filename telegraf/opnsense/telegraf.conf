# =============================================================================
# Telegraf Konfiguration — OPNsense (Hauptwohnsitz)
#
# Metriken: System, Interfaces, Firewall, WireGuard, Gateway
# Ziel: InfluxDB 2.x auf Unraid
#
# Installation auf OPNsense:
#   System → Firmware → Plugins → os-telegraf installieren
#   System → Telegraf → Input/Output konfigurieren
#
# WICHTIG: OPNsense Telegraf-Plugin unterstützt InfluxDB 2.x via
#          "Additional Configuration" (unten) oder DBRP-Mapping.
#          Empfohlen: Weg A (DBRP-Kompatibilitätsmodus) — siehe docs/
#
# Copyright (c) 2026 Bocki — MIT License
# https://github.com/ReXx09/Bockis-Grafana-Stack
# =============================================================================

# ---------------------------------------------------------------------------
# OUTPUT — InfluxDB 2.x (Weg B: direkt via Token)
# In OPNsense: System → Telegraf → Additional Configuration einfügen
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://<UNRAID-IP>:8086"]
  token = "<INFLUXDB_ADMIN_TOKEN>"
  organization = "home"
  bucket = "homelab"

# ---------------------------------------------------------------------------
# INPUT — System
# ---------------------------------------------------------------------------
[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs"]

[[inputs.system]]

[[inputs.processes]]

# ---------------------------------------------------------------------------
# INPUT — Netzwerk / Interfaces
# ---------------------------------------------------------------------------
[[inputs.net]]
  # Interface-Namen in OPNsense prüfen: ifconfig | grep '^[a-z]'
  # Typisch: em0 (LAN), igb0 (WAN), ovpnc1 (OpenVPN), wg0 (WireGuard)
  interfaces = ["em0", "igb0", "wg0"]

[[inputs.netstat]]

# ---------------------------------------------------------------------------
# INPUT — OPNsense Firewall (pf)
# ---------------------------------------------------------------------------
[[inputs.pf]]

# ---------------------------------------------------------------------------
# INPUT — WireGuard
# ---------------------------------------------------------------------------
[[inputs.wireguard]]
  devices = ["wg0"]

# ---------------------------------------------------------------------------
# INPUT — Temperaturen
# ---------------------------------------------------------------------------
[[inputs.temp]]

# ---------------------------------------------------------------------------
# AGENT
# ---------------------------------------------------------------------------
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  precision = ""
  hostname = "opnsense-hauptwohnsitz"
  omit_hostname = false
