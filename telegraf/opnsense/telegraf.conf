# =============================================================================
# Telegraf Konfiguration — OPNsense (os-telegraf Plugin)
#
# OPNsense ist FreeBSD-basiert und laeuft nicht in Docker. Systemmetriken
# (CPU, RAM, Interfaces, Disk) werden ueber das offizielle OPNsense-Plugin
# "os-telegraf" erfasst, nicht ueber einen eigenen Container.
#
# Installation:
#   1. In OPNsense: System -> Firmware -> Plugins -> "os-telegraf" installieren
#   2. Danach: Services -> Telegraf -> General
#      - Agent-, Output- und Input-Bloecke unten in die jeweiligen
#        Textfelder des Plugins uebernehmen (nicht als Datei hochladen)
#   3. Platzhalter durch echte Werte aus dem AIO-Setup ersetzen
#
# Fuer die Firewall-Logs (Pass/Block, Geomap) ist KEIN Telegraf noetig:
# Das laeuft bereits separat ueber Syslog -> Grafana Alloy -> Loki
# (siehe System -> Settings -> Logging -> Remote in OPNsense).
# =============================================================================

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "30s"
  flush_jitter = "0s"
  precision = ""
  hostname = "opnsense"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://UNRAID-IP:8086"]
  token = "INFLUXDB_ADMIN_TOKEN"
  organization = "home"
  bucket = "homelab"

[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.system]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devfs", "procfs", "linprocfs"]

# ---------------------------------------------------------------------------
# Netzwerk-Interfaces
# Auf "interfaces" beschraenken, um virtuelle/VLAN-Interfaces auszublenden.
# Namen (z. B. igb0, igb1) an die eigene Hardware anpassen.
# ---------------------------------------------------------------------------
[[inputs.net]]
  interfaces = ["igb0", "igb1"]
