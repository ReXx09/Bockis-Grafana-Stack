# =============================================================================
# Telegraf Konfiguration — Raspberry Pi (native Agent)
#
# Fuer Raspberry-Pi-Geraete, auf denen Telegraf direkt (ohne Docker) laeuft
# und Metriken an die zentrale AIO-InfluxDB auf dem Unraid-Server sendet.
# Nicht zu verwechseln mit dem eigenstaendigen Fallback-Stack unter
# docker/raspi/ (eigene InfluxDB/Grafana/Loki/Alloy).
#
# Installation (Raspberry Pi OS / Debian):
#   1. Telegraf-Paket installieren: https://docs.influxdata.com/telegraf/latest/install/
#   2. Diese Datei nach /etc/telegraf/telegraf.conf kopieren
#   3. Umgebungsvariablen unten in /etc/default/telegraf setzen
#   4. Dienst starten: sudo systemctl enable --now telegraf
#
# Benoetigte Umgebungsvariablen:
#   INFLUXDB_URL      z. B. http://UNRAID-IP:8086
#   INFLUXDB_TOKEN     Token aus dem AIO-Setup (InfluxDB Admin Token)
#   INFLUXDB_ORG       Organisation aus dem AIO-Setup (Standard: home)
#   INFLUXDB_BUCKET    Bucket aus dem AIO-Setup (Standard: homelab)
#   TELEGRAF_HOSTNAME  eindeutiger Name, z. B. raspi-wohnzimmer
# =============================================================================

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "${TELEGRAF_HOSTNAME}"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.processes]]

# ---------------------------------------------------------------------------
# CPU-Temperatur (Raspberry Pi SoC)
# Liest den Thermal-Zone-Sensor, der auf allen Raspberry-Pi-Modellen
# unter diesem Pfad verfuegbar ist (kein vcgencmd/root noetig).
# ---------------------------------------------------------------------------
[[inputs.temp]]

[[inputs.file]]
  files = ["/sys/class/thermal/thermal_zone0/temp"]
  name_override = "cpu_temperature"
  data_format = "value"
  data_type = "integer"

# Optional: Docker-Container auf dem Raspi mitueberwachen (falls vorhanden)
# [[inputs.docker]]
#   endpoint = "unix:///var/run/docker.sock"
#   gather_services = false
