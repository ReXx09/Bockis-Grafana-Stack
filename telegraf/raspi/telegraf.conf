# =============================================================================
# Telegraf Konfiguration — Raspberry Pi (Nebenwohnsitz)
#
# Metriken: System, CPU, RAM, Disk, Netzwerk, WireGuard, Docker
# Ziel: InfluxDB 2.x auf Unraid
#
# Installation:
#   sudo apt install telegraf
#   sudo cp telegraf.conf /etc/telegraf/telegraf.conf
#   sudo systemctl enable --now telegraf
#
# Copyright (c) 2026 Bocki — MIT License
# https://github.com/ReXx09/Bockis-Grafana-Stack
# =============================================================================

# ---------------------------------------------------------------------------
# OUTPUT — InfluxDB 2.x auf Unraid
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://<UNRAID-IP>:8086"]
  token = "<INFLUXDB_ADMIN_TOKEN>"
  organization = "home"
  bucket = "homelab"

# ---------------------------------------------------------------------------
# INPUT — System
# ---------------------------------------------------------------------------
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.system]]

[[inputs.processes]]

[[inputs.kernel]]

# ---------------------------------------------------------------------------
# INPUT — Netzwerk
# ---------------------------------------------------------------------------
[[inputs.net]]
  interfaces = ["eth0", "wg0"]

[[inputs.netstat]]

# ---------------------------------------------------------------------------
# INPUT — Temperatur (Raspberry Pi)
# ---------------------------------------------------------------------------
[[inputs.temp]]

# ---------------------------------------------------------------------------
# INPUT — WireGuard
# ---------------------------------------------------------------------------
[[inputs.wireguard]]
  devices = ["wg0"]

# ---------------------------------------------------------------------------
# INPUT — Docker
# ---------------------------------------------------------------------------
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = []
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice = true
  total = false
  docker_label_include = []
  docker_label_exclude = []

# ---------------------------------------------------------------------------
# AGENT
# ---------------------------------------------------------------------------
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "raspi-nebenwohnsitz"
  omit_hostname = false
