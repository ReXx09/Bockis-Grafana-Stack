# =============================================================================
# Telegraf Konfiguration — Unraid Host
#
# Metriken: CPU, RAM, Disk, Netzwerk, Docker
# Ziel: InfluxDB 2.x (lokal im selben Docker-Netz)
# =============================================================================

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "unraid-host"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.processes]]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  timeout = "5s"
  perdevice = true
  total = false

# ---------------------------------------------------------------------------
# OPTIONAL: OPNsense Firewall-Logs fuer Block/Allow Weltkarte
#
# Voraussetzung:
# - OPNsense sendet filterlog per Syslog an Unraid:5514
# - Externe GeoIP DB ist vorhanden (z. B. GeoLite2-City.mmdb)
# - Bei Bedarf Parser/Filter auf dein OPNsense-Logformat anpassen
# ---------------------------------------------------------------------------
[[inputs.syslog]]
  server = "udp://:5514"
  best_effort = true

[[processors.geoip]]
  source = "source"
  database = "/etc/telegraf/geoip/GeoLite2-City.mmdb"
  fields = ["country", "city", "latitude", "longitude"]
  tag_keys = ["country", "city"]

# action (block/pass) sollte aus dem filterlog-Text geparst werden,
# z. B. mit parser/regex auf message oder ueber vorgeschalteten Log-Collector.
