services:
  influxdb:
    image: influxdb:2.7
    container_name: raspi-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-home}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-homelab}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-30d}
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
      - ./data/influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.5.2
    container_name: raspi-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG:-home}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-homelab}
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy

  telegraf:
    image: telegraf:1.34
    container_name: raspi-telegraf
    restart: unless-stopped
    environment:
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-home}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-homelab}
      - TELEGRAF_HOSTNAME=${TELEGRAF_HOSTNAME:-raspi-stack}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      influxdb:
        condition: service_healthy

  loki:
    image: grafana/loki:3.4.2
    container_name: raspi-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./data/loki:/loki
      - ./loki-config.yml:/etc/loki/config.yml:ro

  alloy:
    image: grafana/alloy:v1.7.5
    container_name: raspi-alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    ports:
      - "${ALLOY_PORT:-12345}:12345"
      - "${SYSLOG_PORT:-5514}:5514/udp"
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
