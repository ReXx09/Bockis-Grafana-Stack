name: Publish Bocki Grafana AIO

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/rexx09/bockis-grafana-aio
  TELEGRAF_IMAGE_NAME: ghcr.io/rexx09/bockis-telegraf

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run manager tests
        run: python -m unittest aio.test_app -q

      - name: Validate Unraid templates
        run: >-
          python -c "import glob, xml.etree.ElementTree as ET; files=glob.glob('docker/unraid/templates/*.xml'); assert files, 'No Unraid templates found'; roots=[ET.parse(path).getroot() for path in files]; assert all(root.findtext('Icon') for root in roots)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=0.3.43,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: aio/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AIO_COMMIT=${{ github.sha }}

      - name: Telegraf metadata
        id: telegraf-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TELEGRAF_IMAGE_NAME }}
          tags: |
            type=raw,value=1.34-smart,enable={{is_default_branch}}

      - name: Build and push Telegraf with smartmontools
        uses: docker/build-push-action@v6
        with:
          context: docker/telegraf
          file: docker/telegraf/Dockerfile
          push: true
          tags: ${{ steps.telegraf-meta.outputs.tags }}
          labels: ${{ steps.telegraf-meta.outputs.labels }}
